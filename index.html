<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Day Paying - Ultimate Workspace</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg-color: #f1f5f9; 
            --panel-bg: #ffffff;
            --text-dark: #1e293b; 
            --text-light: #64748b; 
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --primary: #6366f1; 
            --primary-light: #e0e7ff; 
            --success: #10b981; 
            --danger: #ef4444; 
            --warning: #f59e0b; 
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-light: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --primary-light: #312e81;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; margin: 0; padding: 0; background: var(--bg-color); min-height: 100vh; color: var(--text-dark); letter-spacing: 0.2px; overflow-x: hidden; }
        .lucide { vertical-align: middle; margin-bottom: 2px; }

        .app-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        #authSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 22px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .auth-card h2 { margin: 0 0 6px; color: var(--primary); font-size: 22px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .auth-card p { margin: 0 0 18px; font-size: 13px; color: var(--text-light); }

        .auth-error-msg {
            display: none;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 14px;
            text-align: left;
            word-break: break-word;
        }

        .current-host-tag {
            font-size: 11px;
            color: var(--text-light);
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            padding: 4px 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .auth-tab-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .auth-tab-btn {
            background: none;
            border: none;
            padding: 8px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-light);
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .auth-tab-btn.active {
            background: var(--panel-bg);
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: 600;
        }

        .google-btn {
            width: 100%;
            background: white;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 11px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-family: inherit;
            margin-bottom: 14px;
        }
        .google-btn:hover { background: #f8fafc; }
        .divider { display: flex; align-items: center; text-align: center; margin: 14px 0; color: var(--text-light); font-size: 11px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider span { padding: 0 10px; }

        .header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: var(--panel-bg); padding: 15px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid var(--border-color);}
        .header h1 { margin: 0; font-size: 20px; color: var(--primary); display: flex; align-items: center; gap:8px; font-weight: 600;}
        .header p { margin: 2px 0 0 0; font-size: 12px; color: var(--text-light); font-weight: 300;}
        
        .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .month-selector { background: var(--input-bg); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 10px; font-weight: 500; font-size: 12px; color: var(--text-dark); cursor: pointer; font-family: inherit;}
        .icon-btn { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-dark); padding: 6px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 5px; font-weight: 500;}
        .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

        .top-dashboard-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .main-dashboard-grid { display: flex; flex-direction: column; gap: 15px; }

        @media (min-width: 900px) {
            .app-container { padding: 25px; }
            .header { flex-direction: row; justify-content: space-between; align-items: center; }
            .top-dashboard-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
            .main-dashboard-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
        }

        .panel { background: var(--panel-bg); border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 15px; width: 100%; border: 1px solid var(--border-color); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;}
        .panel-header h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500;}
        
        .action-btn { background: var(--primary-light); color: var(--primary); border: none; width: 30px; height: 30px; border-radius: 8px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .del-btn { background: #fee2e2; color: var(--danger); border: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        
        .list-container { max-height: 400px; overflow-y: auto; padding-right: 3px; display: flex; flex-direction: column; gap: 8px; }
        .item-card { background: var(--input-bg); border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); width: 100%; box-sizing: border-box; }
        .item-info h4 { margin: 0 0 3px; font-size: 13px; font-weight: 500;}
        .item-info p { margin: 0; font-size: 11px; color: var(--text-light); font-weight: 300;}
        
        .check-btn { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #cbd5e1; display: flex; justify-content: center; align-items: center; cursor: pointer; background: var(--panel-bg); flex-shrink: 0;}
        .check-btn.checked { background: var(--success); border-color: var(--success); color: white; }

        .form-group { margin-bottom: 12px; position: relative; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-light); font-weight:500;}
        .form-group input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--input-bg); font-size: 13px; box-sizing: border-box; font-family: inherit; color: var(--text-dark);}
        .submit-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-top: 5px; cursor: pointer; font-family: inherit;}
        
        .floating-add-btn { position: fixed; bottom: 20px; right: 20px; background: var(--text-dark); color: var(--panel-bg); width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; z-index: 50;}
    </style>
</head>
<body>

<div id="authSection">
    <div class="auth-card">
        <h2><i data-lucide="layout-dashboard"></i> To-Day Paying</h2>
        <p>เข้าสู่ระบบเพื่อจัดการข้อมูลส่วนบุคคลของคุณ</p>

        <div class="current-host-tag">โดเมนปัจจุบัน: <b id="hostDisplay">กำลังตรวจสอบ...</b></div>
        <div class="auth-error-msg" id="authErrorMsg"></div>

        <button class="google-btn" type="button" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            เข้าสู่ระบบด้วย Google
        </button>

        <div class="divider"><span>หรือเลือกวิธีอื่น</span></div>

        <div class="auth-tab-buttons">
            <button class="auth-tab-btn active" id="tabEmailBtn" type="button" onclick="switchAuthTab('email')">
                <i data-lucide="mail" size="14"></i> อีเมล
            </button>
            <button class="auth-tab-btn" id="tabPhoneBtn" type="button" onclick="switchAuthTab('phone')">
                <i data-lucide="phone" size="14"></i> เบอร์โทรศัพท์
            </button>
        </div>

        <div id="emailAuthContainer">
            <form id="emailAuthForm" onsubmit="handleEmailAuth(event)">
                <div class="form-group" style="text-align:left;">
                    <label>อีเมล</label>
                    <input type="email" id="authEmail" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group" style="text-align:left;">
                    <label>รหัสผ่าน</label>
                    <input type="password" id="authPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn" id="authSubmitBtn">เข้าสู่ระบบ</button>
            </form>
            
            <p style="margin-top:14px; font-size:12px;">
                <span id="authToggleText">ยังไม่มีบัญชีใช่หรือไม่?</span> 
                <a href="javascript:void(0)" onclick="toggleAuthMode()" id="authToggleLink" style="color:var(--primary); font-weight:600; text-decoration:none;">สมัครสมาชิก</a>
            </p>
        </div>

        <div id="phoneAuthContainer" style="display: none;">
            <div id="phoneStep1">
                <div class="form-group" style="text-align:left;">
                    <label>เบอร์โทรศัพท์มือถือ</label>
                    <input type="tel" id="phoneNumber" placeholder="+66812345678 (ใส่ +66 นำหน้า)">
                </div>
                <div id="recaptcha-container" style="display:flex; justify-content:center; margin-bottom: 10px;"></div>
                <button type="button" class="submit-btn" onclick="sendPhoneOtp()">ส่งรหัส OTP</button>
            </div>

            <div id="phoneStep2" style="display: none;">
                <div class="form-group" style="text-align:left;">
                    <label>รหัสยืนยัน OTP 6 หลัก</label>
                    <input type="number" id="verificationCode" placeholder="123456">
                </div>
                <button type="button" class="submit-btn" onclick="verifyPhoneOtp()">ยืนยันรหัส OTP</button>
                <p style="margin-top:10px;"><a href="javascript:void(0)" onclick="resetPhoneAuth()" style="font-size:12px; color:var(--text-light);">← เปลี่ยนเบอร์โทรศัพท์</a></p>
            </div>
        </div>
    </div>
</div>

<div class="app-container" id="appMainSection" style="display: none;">
    <div class="header">
        <div>
            <h1><i data-lucide="layout-dashboard" size="18"></i> To-Day Paying</h1>
            <p id="txt-subtitle">ระบบจัดการงบประมาณและรายจ่ายประจำเดือน</p>
        </div>
        <div class="header-controls">
            <button class="icon-btn" onclick="logoutUser()" title="ออกจากระบบ" style="color:var(--danger); border-color:#fca5a5;"><i data-lucide="log-out" size="14"></i> ออกจากระบบ</button>
        </div>
    </div>
    <div class="panel">
        <h3 style="color:var(--success);">✅ เข้าสู่ระบบสำเร็จแล้ว</h3>
        <p style="font-size:13px; color:var(--text-light);" id="userEmailDisplay"></p>
    </div>
</div>

<script>
    lucide.createIcons();

    // แสดงชื่อ Hostname ปัจจุบันที่เปิดอยู่จริง
    const currentHost = window.location.hostname || "localhost";
    document.getElementById('hostDisplay').innerText = currentHost;

    const firebaseConfig = { 
        apiKey: "AIzaSyA81Ez9tZgdiE8pAVxlWhuSnkxfp6AaFU8", 
        authDomain: "todaypaying-7e8b0.firebaseapp.com", 
        projectId: "todaypaying-7e8b0", 
        storageBucket: "todaypaying-7e8b0.firebasestorage.app", 
        messagingSenderId: "584971063665", 
        appId: "1:584971063665:web:3a42354f8136e5c4ebe6d0" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let currentUser = null;
    let isRegisterMode = false;
    let confirmationResultGlobal = null;

    function showAuthError(msg) {
        const el = document.getElementById('authErrorMsg');
        el.innerHTML = `⚠️ <b>ข้อผิดพลาด:</b> ${msg}<br><small>อย่าลืมตรวจเช็กว่าได้เพิ่ม <u>${currentHost}</u> ใน Authorized domains หรือยัง</small>`;
        el.style.display = 'block';
    }

    function clearAuthError() {
        const el = document.getElementById('authErrorMsg');
        el.style.display = 'none';
        el.innerText = '';
    }

    function switchAuthTab(tab) {
        clearAuthError();
        const isEmail = tab === 'email';
        document.getElementById('emailAuthContainer').style.display = isEmail ? 'block' : 'none';
        document.getElementById('phoneAuthContainer').style.display = isEmail ? 'none' : 'block';
        document.getElementById('tabEmailBtn').classList.toggle('active', isEmail);
        document.getElementById('tabPhoneBtn').classList.toggle('active', !isEmail);
        
        if (!isEmail) {
            initRecaptcha();
        }
    }

    function initRecaptcha() {
        if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                'size': 'normal'
            });
            window.recaptchaVerifier.render();
        }
    }

    function sendPhoneOtp() {
        clearAuthError();
        const phone = document.getElementById('phoneNumber').value.trim();
        if (!phone) {
            showAuthError("กรุณากรอกเบอร์โทรศัพท์ (เช่น +66812345678)");
            return;
        }
        initRecaptcha();
        auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
            .then((confirmationResult) => {
                confirmationResultGlobal = confirmationResult;
                document.getElementById('phoneStep1').style.display = 'none';
                document.getElementById('phoneStep2').style.display = 'block';
            }).catch((err) => {
                showAuthError(`${err.code}: ${err.message}`);
            });
    }

    function verifyPhoneOtp() {
        clearAuthError();
        const code = document.getElementById('verificationCode').value.trim();
        if (!code) {
            showAuthError("กรุณากรอกรหัส OTP 6 หลัก");
            return;
        }
        if (confirmationResultGlobal) {
            confirmationResultGlobal.confirm(code).catch(err => {
                showAuthError(`${err.code}: ${err.message}`);
            });
        }
    }

    function resetPhoneAuth() {
        clearAuthError();
        document.getElementById('phoneStep1').style.display = 'block';
        document.getElementById('phoneStep2').style.display = 'none';
    }

    // จัดการ Auth State
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('appMainSection').style.display = 'flex';
            document.getElementById('userEmailDisplay').innerText = `ผู้ใช้งาน: ${user.email || user.phoneNumber || user.uid}`;
        } else {
            currentUser = null;
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('appMainSection').style.display = 'none';
        }
        lucide.createIcons();
    });

    function toggleAuthMode() {
        clearAuthError();
        isRegisterMode = !isRegisterMode;
        document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
        document.getElementById('authToggleText').innerText = isRegisterMode ? 'มีบัญชีอยู่แล้วใช่หรือไม่?' : 'ยังไม่มีบัญชีใช่หรือไม่?';
        document.getElementById('authToggleLink').innerText = isRegisterMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
    }

    function handleEmailAuth(e) {
        e.preventDefault();
        clearAuthError();
        const email = document.getElementById('authEmail').value.trim();
        const pass = document.getElementById('authPassword').value;

        if (isRegisterMode) {
            auth.createUserWithEmailAndPassword(email, pass).catch(err => {
                showAuthError(`${err.code}: ${err.message}`);
            });
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(err => {
                showAuthError(`${err.code}: ${err.message}`);
            });
        }
    }

    function loginWithGoogle() {
        clearAuthError();
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => {
            // หากเปิดบนมือถือแล้ว Pop-up ถูกเบราว์เซอร์บล็อก ให้เปลี่ยนไปใช้ Redirect
            if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
                auth.signInWithRedirect(provider);
            } else {
                showAuthError(`${err.code}: ${err.message}`);
            }
        });
    }

    function logoutUser() {
        auth.signOut();
    }
</script>
</body>
</html>
