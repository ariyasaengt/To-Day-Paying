<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- โหลดไลบรารี PapaParse สำหรับดึงข้อมูลจาก Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* สไตล์ CSS อิงจากรูปภาพของคุณ */
        :root {
            --bg-color: #f4f6fc;
            --primary: #8a78ff;
            --text-dark: #2d3142;
            --text-light: #9094a6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5e5e5;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        /* จำลองหน้าจอมือถือ */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(180deg, #d8d4ff 0%, var(--bg-color) 25%);
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            padding: 30px 20px 80px 20px;
            overflow-x: hidden;
        }
        /* ส่วนหัว */
        .header { margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--text-dark); }
        .header p { margin: 5px 0 0; font-size: 14px; color: var(--text-light); }
        
        /* สรุป 3 กล่อง (รายรับ, รายจ่าย, คงเหลือ) */
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px 10px;
            width: 30%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
        }
        .summary-card .icon { font-size: 24px; margin-bottom: 5px; }
        .summary-card h3 { margin: 0; font-size: 12px; color: var(--text-light); font-weight: normal; }
        .summary-card p { margin: 5px 0 0; font-size: 15px; color: var(--text-dark); font-weight: bold; }

        /* แถบสถานะ (Progress Card) */
        .progress-card {
            background: var(--primary);
            border-radius: 24px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 15px 30px rgba(138, 120, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .progress-card h2 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 8px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 10px;
        }
        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            width: 65%; /* สามารถแก้เปอร์เซ็นต์ด้วย JS ได้ */
        }
        .progress-text { font-size: 12px; opacity: 0.9; }

        /* รายการใช้จ่าย (Transactions) */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title h3 { margin: 0; font-size: 16px; color: var(--text-dark); }
        .add-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            line-height: 24px;
        }
        .transaction-list { display: flex; flex-direction: column; gap: 12px; }
        .transaction-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
        }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-icon {
            width: 45px;
            height: 45px;
            background: #f0f2f8;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .item-details h4 { margin: 0 0 4px; font-size: 14px; color: var(--text-dark); }
        .item-details p { margin: 0; font-size: 12px; color: var(--text-light); }
        .item-amount { font-size: 14px; font-weight: bold; color: #ff6b6b; } /* สีแดงสำหรับรายจ่าย */
        .item-amount.income { color: #4ecdc4; } /* สีเขียวสำหรับรายรับ */

        /* แถบเมนูด้านล่าง (Bottom Nav) */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 25px;
            height: 65px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .nav-item { color: var(--text-light); font-size: 20px; cursor: pointer; }
        .nav-item.active { color: var(--text-dark); }
    </style>
</head>
<body>

<div class="mobile-container">
    
    <div class="header">
        <h1>Hey, Ariya</h1>
        <p>Ready to track your budget today?</p>
    </div>

    <div class="summary-row">
        <div class="summary-card">
            <div class="icon">💰</div>
            <h3>รายรับ</h3>
            <p id="total-income">฿0</p>
        </div>
        <div class="summary-card">
            <div class="icon">💸</div>
            <h3>รายจ่าย</h3>
            <p id="total-expense">฿0</p>
        </div>
        <div class="summary-card">
            <div class="icon">🏦</div>
            <h3>คงเหลือ</h3>
            <p id="total-balance">฿0</p>
        </div>
    </div>

    <div class="progress-card">
        <h2>งบประมาณเดือนนี้</h2>
        <div class="progress-bar">
            <div class="progress-fill" id="budget-progress"></div>
        </div>
        <div class="progress-text">ใช้จ่ายไปแล้วประมาณ 65% ของงบทั้งหมด</div>
    </div>

    <div class="section-title">
        <h3>รายการล่าสุด (Recent)</h3>
        <button class="add-btn">+</button>
    </div>

    <!-- โค้ดตรงนี้จำลองข้อมูลไปพลางๆ ก่อนโหลดข้อมูลจาก Sheet เสร็จ -->
    <div class="transaction-list" id="transaction-container">
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon">🛒</div>
                <div class="item-details">
                    <h4>CP AXTRA</h4>
                    <p>ของใช้เข้าบ้าน</p>
                </div>
            </div>
            <div class="item-amount">- ฿1,200</div>
        </div>
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon">🛍️</div>
                <div class="item-details">
                    <h4>TikTok Shop</h4>
                    <p>ช้อปปิ้งออนไลน์</p>
                </div>
            </div>
            <div class="item-amount">- ฿350</div>
        </div>
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon">🥩</div>
                <div class="item-details">
                    <h4>โชคดีหมูสด</h4>
                    <p>วัตถุดิบทำอาหาร</p>
                </div>
            </div>
            <div class="item-amount">- ฿250</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠</div>
        <div class="nav-item">📊</div>
        <div class="nav-item">⚙️</div>
    </div>
</div>

<script>
    // 1. นำลิงก์ของคุณมาเติม /pub?output=csv เพื่อดึงข้อมูลมาแสดงผล
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBKKi49NYuLB0rm1pR2OZNcBqpjbIsX1xXtjOLakOskqA1PJB9yEDJmcq5Ndg1doOKNJ_McLMgKi9b/pub?output=csv';

    Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            console.log("ข้อมูลจาก Sheet:", data);
            
            /* 
            --- วิธีนำข้อมูลไปใช้ ---
            หากใน Google Sheet ของคุณมีหัวคอลัมน์ชื่อ "รายการ", "หมวดหมู่", "จำนวนเงิน"
            คุณสามารถเขียนโค้ดเพื่อนำข้อมูลจาก data มาคำนวณและแสดงผลแทนที่ข้อมูลจำลองด้านบนได้เลย
            
            ตัวอย่างการดึงค่า (ลบ Comment เพื่อใช้งาน):
            
            const container = document.getElementById('transaction-container');
            container.innerHTML = ''; // ล้างข้อมูลจำลองทิ้ง
            
            data.forEach(row => {
                if(row['รายการ']){
                    container.innerHTML += `
                    <div class="transaction-item">
                        <div class="item-left">
                            <div class="item-icon">💸</div>
                            <div class="item-details">
                                <h4>${row['รายการ']}</h4>
                                <p>${row['หมวดหมู่']}</p>
                            </div>
                        </div>
                        <div class="item-amount">- ฿${row['จำนวนเงิน']}</div>
                    </div>`;
                }
            });
            */
        }
    });
</script>

</body>
</html>
