<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Paying - Budget Tracker</title>
    
    <!-- โหลดไลบรารี PapaParse สำหรับดึงข้อมูลจาก Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <!-- โหลดไลบรารี Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ตัวแปรสี สไตล์ Soft UI / Neumorphism */
        :root {
            --bg-color: #f4f6fc;
            --primary: #8a78ff;
            --primary-light: #d8d4ff;
            --text-dark: #2d3142;
            --text-light: #9094a6;
            --card-bg: #ffffff;
            --expense: #ff6b6b;
            --income: #4ecdc4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5e5e5; /* สีพื้นหลังสำหรับจอใหญ่ */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* คอนเทนเนอร์หลัก (ปรับขนาดตามหน้าจอ Responsive) */
        .app-container {
            width: 100%;
            max-width: 450px; /* จำกัดความกว้างไม่ให้ใหญ่เกินไปบนจอคอม */
            background: linear-gradient(180deg, var(--primary-light) 0%, var(--bg-color) 30%);
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            padding: 40px 24px 100px 24px;
            box-shadow: 0 0 50px rgba(0,0,0,0.1); /* เพิ่มเงาเวลาอยู่บนจอคอม */
            overflow-y: auto;
        }

        /* สำหรับจอที่ใหญ่กว่ามือถือ (Desktop/Tablet) ให้กำหนดความสูงและขอบโค้งมน */
        @media (min-width: 480px) {
            .app-container {
                min-height: 85vh;
                height: 850px;
                max-height: 90vh;
                border-radius: 40px;
                border: 8px solid #fff;
                overflow-x: hidden;
            }
        }

        /* ส่วนหัว */
        .header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px; 
        }
        .header-text h1 { margin: 0; font-size: 26px; color: var(--text-dark); }
        .header-text p { margin: 5px 0 0; font-size: 14px; color: var(--text-light); }
        .profile-btn {
            background: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* สรุป 3 กล่อง (รายรับ, รายจ่าย, คงเหลือ) */
        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .summary-card i { 
            color: var(--primary); 
            margin-bottom: 8px;
        }
        .summary-card h3 { margin: 0; font-size: 13px; color: var(--text-light); font-weight: 500; }
        .summary-card p { margin: 8px 0 0; font-size: 16px; color: var(--text-dark); font-weight: 700; }

        /* แถบสถานะ (Progress Card) */
        .progress-card {
            background: var(--primary);
            border-radius: 24px;
            padding: 24px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(138, 120, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .progress-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .progress-card h2 { margin: 0; font-size: 18px; font-weight: 600; }
        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 10px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 12px;
        }
        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            width: 65%; /* เปลี่ยนค่าตรงนี้เพื่อเปลี่ยนความยาวหลอด */
        }
        .progress-text { font-size: 13px; opacity: 0.9; }

        /* รายการใช้จ่าย (Transactions) */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title h3 { margin: 0; font-size: 18px; color: var(--text-dark); }
        .add-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .transaction-list { display: flex; flex-direction: column; gap: 15px; }
        .transaction-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .transaction-item:hover {
            transform: translateY(-2px);
        }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* สีไอคอนเฉพาะหมวดหมู่ */
        .icon-food { background: #ffe3e3; color: var(--expense); }
        .icon-shop { background: #e3f2fd; color: #2196f3; }
        .icon-income { background: #e8f5e9; color: var(--income); }

        .item-details h4 { margin: 0 0 6px; font-size: 15px; color: var(--text-dark); }
        .item-details p { margin: 0; font-size: 13px; color: var(--text-light); }
        .item-amount { font-size: 16px; font-weight: bold; color: var(--expense); }
        .item-amount.income { color: var(--income); }

        /* แถบเมนูด้านล่าง (Bottom Nav) */
        .bottom-nav {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: white;
            border-radius: 30px;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .nav-item { 
            color: var(--text-light); 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item i { transition: color 0.3s; }
        .nav-item span { font-size: 10px; font-weight: 500; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <div class="header-text">
            <h1>Today Paying</h1>
            <p>Ready to track your budget today?</p>
        </div>
        <div class="profile-btn">
            <i data-lucide="user"></i>
        </div>
    </div>

    <!-- ส่วนสรุปข้อมูล -->
    <div class="summary-row">
        <div class="summary-card">
            <i data-lucide="arrow-down-circle"></i>
            <h3>รายรับ</h3>
            <p id="total-income">฿0</p>
        </div>
        <div class="summary-card">
            <i data-lucide="arrow-up-circle"></i>
            <h3>รายจ่าย</h3>
            <p id="total-expense">฿0</p>
        </div>
        <div class="summary-card">
            <i data-lucide="wallet"></i>
            <h3>คงเหลือ</h3>
            <p id="total-balance">฿0</p>
        </div>
    </div>

    <!-- ส่วน Progress -->
    <div class="progress-card">
        <div class="progress-card-header">
            <h2>งบประมาณเดือนนี้</h2>
            <i data-lucide="target"></i>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="budget-progress"></div>
        </div>
        <div class="progress-text">ใช้จ่ายไปแล้ว 65% ของงบทั้งหมด</div>
    </div>

    <!-- ส่วนรายการใช้จ่ายล่าสุด -->
    <div class="section-title">
        <h3>รายการล่าสุด (Recent)</h3>
        <button class="add-btn">
            <i data-lucide="plus" size="20"></i>
        </button>
    </div>

    <div class="transaction-list" id="transaction-container">
        <!-- ตัวอย่างข้อมูล 1 -->
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon icon-food">
                    <i data-lucide="utensils"></i>
                </div>
                <div class="item-details">
                    <h4>CP AXTRA</h4>
                    <p>ของใช้เข้าบ้าน</p>
                </div>
            </div>
            <div class="item-amount">- ฿1,200</div>
        </div>

        <!-- ตัวอย่างข้อมูล 2 -->
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon icon-shop">
                    <i data-lucide="shopping-bag"></i>
                </div>
                <div class="item-details">
                    <h4>TikTok Shop</h4>
                    <p>ช้อปปิ้งออนไลน์</p>
                </div>
            </div>
            <div class="item-amount">- ฿350</div>
        </div>

        <!-- ตัวอย่างข้อมูล 3 -->
        <div class="transaction-item">
            <div class="item-left">
                <div class="item-icon icon-food">
                    <i data-lucide="beef"></i>
                </div>
                <div class="item-details">
                    <h4>โชคดีหมูสด</h4>
                    <p>วัตถุดิบทำอาหาร</p>
                </div>
            </div>
            <div class="item-amount">- ฿250</div>
        </div>
    </div>

    <!-- เมนูด้านล่าง -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <i data-lucide="home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i data-lucide="pie-chart"></i>
            <span>Stats</span>
        </div>
        <div class="nav-item">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </div>
    </div>
</div>

<script>
    // คำสั่งสร้างไอคอนของ Lucide Icons (จำเป็นต้องมีเพื่อให้ไอคอนแสดงผล)
    lucide.createIcons();

    // 1. นำลิงก์ของคุณมาเติม /pub?output=csv เพื่อดึงข้อมูลมาแสดงผล
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRBKKi49NYuLB0rm1pR2OZNcBqpjbIsX1xXtjOLakOskqA1PJB9yEDJmcq5Ndg1doOKNJ_McLMgKi9b/pub?output=csv';

    Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const data = results.data;
            console.log("ข้อมูลจาก Sheet:", data);
            
            // รอรับคำสั่งเพิ่มเติมเพื่อนำข้อมูลจาก Sheet มาแทนที่ข้อมูลจำลอง...
        }
    });
</script>

</body>
</html>
