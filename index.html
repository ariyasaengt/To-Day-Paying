<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Buddy</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f4f6fc;
            --primary: #8a78ff;
            --text-dark: #2d3142;
            --text-light: #9094a6;
            --card-bg: #ffffff;
            --success: #34d399; /* สีเขียวสำหรับจ่ายแล้ว */
            --warning: #fbbf24; /* สีเหลืองสำหรับใกล้ถึงกำหนด */
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #e5e5e5;
            margin: 0; display: flex; justify-content: center;
        }
        .mobile-app {
            width: 100%; max-width: 400px; min-height: 100vh;
            background: linear-gradient(180deg, #d8d4ff 0%, var(--bg-color) 25%);
            padding: 30px 20px 80px; box-sizing: border-box;
            position: relative; overflow-x: hidden;
        }
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--text-dark); }
        .header p { margin: 5px 0 0; font-size: 14px; color: var(--text-light); }
        
        /* 3 Cards */
        .summary-cards { display: flex; gap: 10px; margin-bottom: 25px; }
        .card { 
            background: white; border-radius: 20px; padding: 15px 10px; 
            flex: 1; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.03);
        }
        .card i { color: var(--primary); margin-bottom: 5px; }
        .card h3 { margin: 0; font-size: 12px; color: var(--text-light); font-weight: normal; }
        .card p { margin: 5px 0 0; font-size: 16px; font-weight: bold; color: var(--text-dark); }

        /* Progress (Runway) */
        .progress-box {
            background: var(--primary); border-radius: 20px; padding: 20px;
            color: white; margin-bottom: 25px; position: relative; overflow: hidden;
        }
        .progress-box h2 { margin: 0 0 10px; font-size: 16px; }
        .bar-bg { background: rgba(255,255,255,0.3); height: 8px; border-radius: 10px; }
        .bar-fill { background: white; height: 100%; border-radius: 10px; width: 60%; }

        /* Fixed Expenses (Today's Habits) */
        .section-title { font-size: 16px; font-weight: bold; color: var(--text-dark); margin-bottom: 15px; }
        .expense-list { display: flex; flex-direction: column; gap: 12px; }
        .expense-item {
            background: white; border-radius: 15px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .expense-info h4 { margin: 0; font-size: 14px; color: var(--text-dark); }
        .expense-info p { margin: 4px 0 0; font-size: 12px; color: var(--text-light); }
        
        /* Check Button */
        .check-btn {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #e2e8f0;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .check-btn.checked { background: var(--success); border-color: var(--success); color: white; }

        /* Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: white; border-radius: 25px; height: 65px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .nav-item { color: var(--text-light); cursor: pointer; display: flex; flex-direction: column; align-items: center;}
        .nav-item.active { color: var(--primary); }
        
        /* Add Button (Floating) */
        .add-btn {
            background: var(--text-dark); color: white; width: 50px; height: 50px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            position: relative; top: -15px; box-shadow: 0 10px 20px rgba(45,49,66,0.3);
        }
    </style>
</head>
<body>

<div class="mobile-app">
    <div class="header">
        <div>
            <h1>Hey, Ariya</h1>
            <p>Ready to manage your budget?</p>
        </div>
        <i data-lucide="user-circle" size="36" color="#8a78ff"></i>
    </div>

    <!-- 3 สรุปหลัก -->
    <div class="summary-cards">
        <div class="card">
            <i data-lucide="arrow-down-to-line"></i>
            <h3>Income</h3>
            <p>฿17,625</p>
        </div>
        <div class="card">
            <i data-lucide="credit-card"></i>
            <h3>Fixed Exp.</h3>
            <p>฿14,296</p>
        </div>
        <div class="card">
            <i data-lucide="wallet"></i>
            <h3>Runway</h3>
            <p>150 / Day</p>
        </div>
    </div>

    <!-- แถบงบประมาณรายเดือน -->
    <div class="progress-box">
        <h2>Month's Progress</h2>
        <div class="bar-bg"><div class="bar-fill"></div></div>
        <p style="margin: 10px 0 0; font-size: 12px; opacity: 0.9;">14 days left • Keep going!</p>
    </div>

    <!-- รายการค่าใช้จ่ายคงที่ที่ต้องจ่าย (ดัดแปลงจาก Habit Tracker) -->
    <div class="section-title">This Month's Bills</div>
    <div class="expense-list">
        
        <div class="expense-item">
            <div style="display:flex; gap: 15px; align-items: center;">
                <div style="background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 12px;"><i data-lucide="youtube" size="20"></i></div>
                <div class="expense-info">
                    <h4>YouTube Premium</h4>
                    <p>Due: 16/09 (฿129)</p> <!-- ใกล้ถึงกำหนดจ่าย -->
                </div>
            </div>
            <div class="check-btn"><i data-lucide="check" size="16" style="opacity:0"></i></div>
        </div>

        <div class="expense-item">
            <div style="display:flex; gap: 15px; align-items: center;">
                <div style="background: #e0f2fe; color: #0ea5e9; padding: 10px; border-radius: 12px;"><i data-lucide="home" size="20"></i></div>
                <div class="expense-info">
                    <h4>ค่าห้องพัก</h4>
                    <p>Due: 25/09 (฿4,500)</p>
                </div>
            </div>
            <!-- ปุ่มสถานะจ่ายแล้ว -->
            <div class="check-btn checked"><i data-lucide="check" size="16"></i></div>
        </div>

    </div>

    <!-- เมนูและปุ่มเพิ่มรายการ -->
    <div class="bottom-nav">
        <div class="nav-item active"><i data-lucide="home"></i></div>
        <div class="nav-item"><i data-lucide="pie-chart"></i></div>
        <div class="add-btn"><i data-lucide="plus" size="24"></i></div> <!-- ปุ่มบวกตรงกลาง -->
        <div class="nav-item"><i data-lucide="calendar"></i></div>
        <div class="nav-item"><i data-lucide="settings"></i></div>
    </div>
</div>

<script>
    lucide.createIcons();
    // ส่วนนี้จะใช้เขียน Logic ควบคุมปุ่ม Check และดึงข้อมูลจาก API ในภายหลัง
</script>
</body>
</html>
