<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todaypaying - Budget Buddy</title>
    
    <!-- โหลดไลบรารีต่างๆ -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- โหลด Chart.js สำหรับทำกราฟ -->

    <style>
        /* --- ตั้งค่าสีและโครงสร้างพื้นฐาน --- */
        :root {
            --bg-color: #f4f6fc; --primary: #8a78ff; --primary-light: #d8d4ff;
            --text-dark: #2d3142; --text-light: #9094a6; --card-bg: #ffffff;
            --success: #34d399; --danger: #ef4444;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: linear-gradient(135deg, var(--primary-light) 0%, var(--bg-color) 40%); min-height: 100vh; }
        .app-container { width: 100%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        @media (min-width: 768px) {
            .app-container { padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
            .header { grid-column: 1 / -1; margin-bottom: 20px; }
            .bottom-nav { display: none !important; }
            .desktop-add-btn { display: flex !important; background: var(--text-dark); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
            .right-panel { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); height: calc(100vh - 150px); display: flex; flex-direction: column; }
            .scrollable-list { flex: 1; overflow-y: auto; padding-right: 10px; }
            .scrollable-list::-webkit-scrollbar { width: 6px; }
            .scrollable-list::-webkit-scrollbar-thumb { background: #dcdcdc; border-radius: 10px; }
        }
        @media (max-width: 767px) {
            .app-container { padding: 30px 20px 100px 20px; }
            .right-panel { margin-top: 20px; }
            .scrollable-list { display: flex; flex-direction: column; gap: 12px; }
        }

        /* --- สไตล์ UI ทั่วไป --- */
        .desktop-add-btn { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 28px; color: var(--text-dark); }
        .header p { margin: 5px 0 0; font-size: 15px; color: var(--text-light); }
        .profile-btn { background: white; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .left-panel { display: flex; flex-direction: column; gap: 25px; }
        .summary-cards { display: flex; gap: 15px; }
        .card { background: white; border-radius: 20px; padding: 20px 15px; flex: 1; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.03); }
        .card i { color: var(--primary); margin-bottom: 10px; }
        .card h3 { margin: 0; font-size: 13px; color: var(--text-light); font-weight: normal; }
        .card p { margin: 8px 0 0; font-size: 16px; font-weight: bold; color: var(--text-dark); word-break: break-word; }

        .progress-box { background: var(--primary); border-radius: 24px; padding: 25px; color: white; box-shadow: 0 15px 30px rgba(138, 120, 255, 0.3); }
        .progress-box h2 { margin: 0 0 15px; font-size: 18px; font-weight: 600; }
        .bar-bg { background: rgba(255,255,255,0.3); height: 10px; border-radius: 10px; }
        .bar-fill { background: white; height: 100%; border-radius: 10px; width: 0%; transition: width 0.5s ease-out; }
        
        .chart-box { background: white; border-radius: 24px; padding: 25px; box-shadow: 0 15px 30px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; align-items: center;}
        
        .section-title { font-size: 18px; font-weight: bold; color: var(--text-dark); margin-bottom: 15px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .expense-item { background: white; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.02); margin-bottom: 12px; }
        .expense-info h4 { margin: 0 0 4px; font-size: 15px; color: var(--text-dark); }
        .expense-info p { margin: 0; font-size: 13px; color: var(--text-light); }
        
        .check-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #e2e8f0; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s;}
        .check-btn.checked { background: var(--success); border-color: var(--success); color: white; }
        .del-btn { color: #cbd5e1; cursor: pointer; transition: color 0.2s; background: none; border: none; padding: 5px;}
        .del-btn:hover { color: var(--danger); }

        .bottom-nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: white; border-radius: 25px; height: 65px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.08); z-index: 10; }
        .nav-item { color: var(--text-light); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.3s;}
        .nav-item.active { color: var(--primary); }
        .add-btn { background: var(--text-dark); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; top: -15px; box-shadow: 0 10px 20px rgba(45,49,66,0.3); cursor: pointer; transition: transform 0.2s; }
        .add-btn:hover { transform: scale(1.05); }

        /* --- สไตล์ Popup Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 30px 30px 0 0; padding: 30px 25px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @media (min-width: 768px) { .modal-content { border-radius: 30px; align-self: center; transform: scale(0.9); } .modal-overlay.active .modal-content { transform: scale(1); } }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { margin: 0; font-size: 20px; color: var(--text-dark); }
        .close-btn { background: #f0f2f8; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-light); }
        .form-group input, .form-group select { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f9fafb; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
        .submit-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 15px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; box-shadow: 0 10px 20px rgba(138, 120, 255, 0.3); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>Hey, Ariya</h1>
            <p>Ready to manage your budget?</p>
        </div>
        <div class="profile-btn"><i data-lucide="user"></i></div>
    </div>

    <!-- Panel ฝั่งซ้าย (สรุปผลและกราฟ) -->
    <div class="left-panel">
        <div class="summary-cards">
            <div class="card">
                <i data-lucide="arrow-down-to-line"></i>
                <h3>Income</h3>
                <p id="ui-income">฿0</p>
            </div>
            <div class="card">
                <i data-lucide="credit-card"></i>
                <h3>Fixed Exp.</h3>
                <p id="ui-fixed">฿0</p>
            </div>
            <div class="card">
                <i data-lucide="wallet"></i>
                <h3>Runway</h3>
                <p id="ui-runway">0 / Day</p>
            </div>
        </div>

        <div class="progress-box">
            <h2>Month's Progress</h2>
            <div class="bar-bg"><div class="bar-fill" id="ui-progress"></div></div>
            <p style="margin: 15px 0 0; font-size: 13px; opacity: 0.9;" id="ui-days-left">คำนวณข้อมูล...</p>
        </div>

        <!-- เพิ่มกล่องกราฟแสดงสัดส่วนรายจ่าย -->
        <div class="chart-box">
            <h3 style="margin:0 0 15px; font-size:16px; align-self:flex-start;">Expense Breakdown</h3>
            <div style="position: relative; height:200px; width:100%;">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Panel ฝั่งขวา (บิลและประวัติรายการ) -->
    <div class="right-panel">
        <div class="scrollable-list">
            
            <!-- ส่วนของบิลคงที่ -->
            <div class="section-title">
                <span>This Month's Bills</span>
            </div>
            <div id="fixed-expenses-container"></div>

            <!-- ส่วนของประวัติรายการทั่วไป -->
            <div class="section-title">
                <span>Recent Transactions</span>
                <button class="desktop-add-btn" onclick="openModal()"><i data-lucide="plus" size="20"></i></button>
            </div>
            <div id="history-container">
                <p style="text-align:center; font-size: 14px; color: gray;">กำลังโหลดประวัติ...</p>
            </div>
            
        </div>
    </div> 

    <!-- เมนูด้านล่างสำหรับมือถือ -->
    <div class="bottom-nav">
        <div class="nav-item active"><i data-lucide="home"></i></div>
        <div class="nav-item"><i data-lucide="pie-chart"></i></div>
        <div class="add-btn" onclick="openModal()"><i data-lucide="plus" size="24"></i></div>
        <div class="nav-item"><i data-lucide="calendar"></i></div>
        <div class="nav-item"><i data-lucide="settings"></i></div>
    </div>
</div>

<!-- Popup Modal -->
<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add Transaction</h2>
            <button class="close-btn" onclick="closeModal()"><i data-lucide="x" size="18"></i></button>
        </div>
        <form id="addForm" onsubmit="submitTransaction(event)">
            <div class="form-group">
                <label>ประเภท (Type)</label>
                <select id="inputType" onchange="changeCategoryOptions()">
                    <option value="expense">รายจ่าย (Expense)</option>
                    <option value="income">รายรับ (Income)</option>
                </select>
            </div>
            <div class="form-group">
                <label>จำนวนเงิน (Amount - ฿)</label>
                <input type="number" id="inputAmount" placeholder="0" required min="1">
            </div>
            <div class="form-group">
                <label>รายการ (Title)</label>
                <input type="text" id="inputName" placeholder="เช่น กินข้าว, โลตัส ออนไลน์" required>
            </div>
            <div class="form-group">
                <label>หมวดหมู่ (Category)</label>
                <select id="inputCategory">
                    <option value="อาหาร">อาหาร</option>
                    <option value="ของใช้">ของใช้</option>
                    <option value="เดินทาง">เดินทาง</option>
                    <option value="ช้อปปิ้ง">ช้อปปิ้ง</option>
                    <option value="อื่นๆ">อื่นๆ</option>
                </select>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">บันทึก (Save)</button>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();

    // ตั้งค่า Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyA81Ez9tZgdiE8pAVxlWhuSnkxfp6AaFU8",
        authDomain: "todaypaying-7e8b0.firebaseapp.com",
        projectId: "todaypaying-7e8b0",
        storageBucket: "todaypaying-7e8b0.firebasestorage.app",
        messagingSenderId: "584971063665",
        appId: "1:584971063665:web:3a42354f8136e5c4ebe6d0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database(firebase.app(), "https://todaypaying-7e8b0-default-rtdb.asia-southeast1.firebasedatabase.app/"); 

    let totalIncome = 0;
    let totalFixed = 0;
    let totalVariableExpense = 0;
    let myChart = null; // ตัวแปรกราฟ

    // ดึงค่าใช้จ่ายคงที่ (Bills)
    const fixedExpensesRef = db.ref('todaypaying/fixed_expenses'); 
    fixedExpensesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('fixed-expenses-container');
        container.innerHTML = '';
        totalFixed = 0;

        if (data) {
            const today = new Date().getDate(); 
            Object.keys(data).forEach(key => {
                const bill = data[key];
                const amount = bill.amount || 0;
                const dueDate = bill.dueDate || 0;
                const name = bill.name || 'ไม่มีชื่อ';
                const status = bill.status || 'unpaid';
                const icon = bill.icon || 'file-text';
                const color = bill.color || '#9094a6';

                totalFixed += amount;
                const isPaid = status === 'paid';
                const checkClass = isPaid ? 'check-btn checked' : 'check-btn';
                const checkIconStyle = isPaid ? '' : 'style="opacity:0"';
                const isDueSoon = !isPaid && (dueDate >= today && dueDate <= today + 3);
                const dueText = isDueSoon 
                    ? `<span style="color:var(--danger); font-weight:bold;">Due: วันที่ ${dueDate} (฿${amount.toLocaleString()}) - รีบจ่าย!</span>` 
                    : `Due: วันที่ ${dueDate} (฿${amount.toLocaleString()})`;

                const html = `<div class="expense-item"><div style="display:flex; gap: 15px; align-items: center;"><div style="background: ${color}20; color: ${color}; padding: 10px; border-radius: 12px;"><i data-lucide="${icon}" size="20"></i></div><div class="expense-info"><h4>${name}</h4><p>${dueText}</p></div></div><div class="${checkClass}" onclick="toggleBillStatus('${key}', '${status}')"><i data-lucide="check" size="16" ${checkIconStyle}></i></div></div>`;
                container.innerHTML += html;
            });
            lucide.createIcons();
            updateDashboard();
        } else {
            container.innerHTML = '<p style="text-align:center; font-size: 14px; color: gray;">ยังไม่มีรายการบิลในเดือนนี้</p>';
        }
    });

    // ดึงประวัติรายการ และทำกราฟ (History & Chart)
    const txRef = db.ref('todaypaying/transactions');
    txRef.on('value', (snapshot) => {
        totalIncome = 0;
        totalVariableExpense = 0;
        
        const data = snapshot.val();
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = '';
        
        let categoryTotals = {}; // เก็บยอดรวมแต่ละหมวดหมู่

        if(data){
            // แปลงข้อมูลเป็น Array แล้วเรียงจากใหม่สุดไปเก่าสุด
            const txArray = Object.keys(data).map(key => ({ key, ...data[key] }));
            txArray.reverse(); 

            txArray.forEach(tx => {
                const amount = tx.amount || 0;
                
                // คำนวณยอด
                if(tx.type === 'income') {
                    totalIncome += amount;
                } else if (tx.type === 'expense') {
                    totalVariableExpense += amount;
                    // รวมยอดเข้าหมวดหมู่สำหรับทำกราฟ
                    categoryTotals[tx.category] = (categoryTotals[tx.category] || 0) + amount;
                }

                // สร้าง HTML ประวัติ
                const isIncome = tx.type === 'income';
                const sign = isIncome ? '+' : '-';
                const amountColor = isIncome ? 'var(--success)' : 'var(--text-dark)';
                const iconName = isIncome ? 'wallet' : 'shopping-bag';
                const iconBg = isIncome ? '#e8f5e9' : '#f0f2f8';
                const iconColor = isIncome ? 'var(--success)' : 'var(--primary)';

                const html = `
                <div class="expense-item">
                    <div style="display:flex; gap: 15px; align-items: center;">
                        <div style="background: ${iconBg}; color: ${iconColor}; padding: 10px; border-radius: 12px;">
                            <i data-lucide="${iconName}" size="20"></i>
                        </div>
                        <div class="expense-info">
                            <h4>${tx.name}</h4>
                            <p>${tx.category} • ${tx.date}</p>
                        </div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:bold; color:${amountColor}">${sign}฿${amount.toLocaleString()}</span>
                        <button class="del-btn" onclick="deleteTransaction('${tx.key}')" title="ลบรายการ"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                </div>`;
                historyContainer.innerHTML += html;
            });
            lucide.createIcons();
            updateChart(categoryTotals);
        } else {
            historyContainer.innerHTML = '<p style="text-align:center; font-size: 14px; color: gray;">ยังไม่มีประวัติการใช้จ่าย</p>';
            updateChart({}); // ล้างกราฟ
        }
        updateDashboard();
    });

    // ฟังก์ชันสร้าง/อัปเดตกราฟ
    function updateChart(catData) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        const labels = Object.keys(catData);
        const values = Object.values(catData);
        
        // ชุดสีพาสเทลสำหรับกราฟ
        const colors = ['#ff8a8a', '#8a78ff', '#4ecdc4', '#ffd166', '#a0aec0'];

        if(myChart) {
            myChart.data.labels = labels;
            myChart.data.datasets[0].data = values;
            myChart.update();
        } else {
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { font: { family: "'Segoe UI', sans-serif" } } } },
                    cutout: '70%'
                }
            });
        }
    }

    // ฟังก์ชันอัปเดตตัวเลขหน้าจอ
    function updateDashboard() {
        document.getElementById('ui-income').innerText = `฿${totalIncome.toLocaleString()}`;
        document.getElementById('ui-fixed').innerText = `฿${totalFixed.toLocaleString()}`;

        const daysInMonth = 30; 
        const today = new Date().getDate();
        const daysLeft = daysInMonth - today + 1;
        
        let runway = 0;
        if(daysLeft > 0) runway = (totalIncome - totalFixed - totalVariableExpense) / daysLeft;

        document.getElementById('ui-runway').innerText = `${Math.max(0, runway).toLocaleString('en-US', {maximumFractionDigits: 0})} / Day`;
        document.getElementById('ui-days-left').innerText = `เหลืออีก ${daysLeft} วันในเดือนนี้`;
        
        let totalAllExpense = totalFixed + totalVariableExpense;
        let percent = (totalAllExpense / totalIncome) * 100;
        if(isNaN(percent) || percent === Infinity) percent = 0;
        if(percent > 100) percent = 100;
        
        document.getElementById('ui-progress').style.width = `${percent}%`; 
    }

    // --- ฟังก์ชันการทำงาน (Actions) ---

    // ลบรายการทั่วไป
    function deleteTransaction(key) {
        if(confirm("แน่ใจหรือไม่ว่าต้องการลบรายการนี้?")) {
            db.ref('todaypaying/transactions/' + key).remove();
        }
    }

    // กดจ่ายบิล
    function toggleBillStatus(billKey, currentStatus) {
        const newStatus = currentStatus === 'paid' ? 'unpaid' : 'paid';
        db.ref(`todaypaying/fixed_expenses/${billKey}`).update({ status: newStatus });
    }

    // ระบบ Popup เพิ่มรายการ
    const modal = document.getElementById('addModal');
    function openModal() { modal.classList.add('active'); }
    function closeModal() { modal.classList.remove('active'); document.getElementById('addForm').reset(); }
    
    function changeCategoryOptions() {
        const type = document.getElementById('inputType').value;
        const catSelect = document.getElementById('inputCategory');
        if (type === 'income') catSelect.innerHTML = `<option value="เงินเดือน">เงินเดือน (Salary)</option><option value="รายได้เสริม">รายได้เสริม (Freelance)</option><option value="อื่นๆ">อื่นๆ (Others)</option>`;
        else catSelect.innerHTML = `<option value="อาหาร">อาหาร (Food)</option><option value="ของใช้">ของใช้ (Grocery)</option><option value="เดินทาง">เดินทาง (Transport)</option><option value="ช้อปปิ้ง">ช้อปปิ้ง (Shopping)</option><option value="อื่นๆ">อื่นๆ (Others)</option>`;
    }

    function submitTransaction(event) {
        event.preventDefault(); 
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "กำลังบันทึก...";
        
        const type = document.getElementById('inputType').value;
        const amount = Number(document.getElementById('inputAmount').value);
        const name = document.getElementById('inputName').value;
        const category = document.getElementById('inputCategory').value;
        const dateStr = new Date().toISOString().split('T')[0];

        db.ref('todaypaying/transactions').push({
            type: type, amount: amount, name: name, category: category, date: dateStr, timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            closeModal(); btn.disabled = false; btn.innerText = "บันทึก (Save)";
        }).catch((error) => {
            alert("เกิดข้อผิดพลาด: " + error);
            btn.disabled = false; btn.innerText = "บันทึก (Save)";
        });
    }
