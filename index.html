<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Paying - Budget Tracker</title>
    
    <!-- โหลดไลบรารี Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ตัวแปรสี สไตล์ Soft UI / Neumorphism */
        :root {
            --bg-color: #f4f6fc;
            --primary: #8a78ff;
            --primary-light: #d8d4ff;
            --text-dark: #2d3142;
            --text-light: #9094a6;
            --card-bg: #ffffff;
            --expense: #ff6b6b;
            --income: #4ecdc4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e5e5e5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* คอนเทนเนอร์หลัก (Responsive) */
        .app-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(180deg, var(--primary-light) 0%, var(--bg-color) 30%);
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            padding: 40px 24px 100px 24px;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        @media (min-width: 480px) {
            .app-container {
                min-height: 85vh;
                height: 850px;
                max-height: 90vh;
                border-radius: 40px;
                border: 8px solid #fff;
                overflow-x: hidden;
            }
        }

        /* ส่วนหัว */
        .header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px; 
        }
        .header-text h1 { margin: 0; font-size: 26px; color: var(--text-dark); }
        .header-text p { margin: 5px 0 0; font-size: 14px; color: var(--text-light); }
        .profile-btn {
            background: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* สรุป 3 กล่อง */
        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 18px 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .summary-card i { color: var(--primary); margin-bottom: 8px; }
        .summary-card h3 { margin: 0; font-size: 13px; color: var(--text-light); font-weight: 500; }
        .summary-card p { margin: 8px 0 0; font-size: 15px; color: var(--text-dark); font-weight: 700; word-break: break-word;}

        /* แถบสถานะ (Progress Card) */
        .progress-card {
            background: var(--primary);
            border-radius: 24px;
            padding: 24px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(138, 120, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .progress-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .progress-card h2 { margin: 0; font-size: 18px; font-weight: 600; }
        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 10px;
            border-radius: 10px;
            width: 100%;
            margin-bottom: 12px;
        }
        .progress-fill {
            background: white;
            height: 100%;
            border-radius: 10px;
            width: 0%; /* จะอัปเดตผ่าน JS */
            transition: width 0.5s ease-in-out;
        }
        .progress-text { font-size: 13px; opacity: 0.9; }

        /* รายการใช้จ่าย */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title h3 { margin: 0; font-size: 18px; color: var(--text-dark); }
        .add-btn {
            background: var(--text-dark);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .transaction-list { display: flex; flex-direction: column; gap: 15px; }
        .transaction-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }
        .transaction-item:hover { transform: translateY(-2px); }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .icon-expense { background: #ffe3e3; color: var(--expense); }
        .icon-income { background: #e8f5e9; color: var(--income); }

        .item-details h4 { margin: 0 0 6px; font-size: 15px; color: var(--text-dark); }
        .item-details p { margin: 0; font-size: 13px; color: var(--text-light); }
        .item-amount { font-size: 16px; font-weight: bold; color: var(--expense); }
        .item-amount.income { color: var(--income); }
        .loading-text { text-align: center; color: var(--text-light); font-size: 14px; margin-top: 20px; }

        /* แถบเมนูด้านล่าง */
        .bottom-nav {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: white;
            border-radius: 30px;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .nav-item { 
            color: var(--text-light); 
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item i { transition: color 0.3s; }
        .nav-item span { font-size: 10px; font-weight: 500; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <div class="header-text">
            <h1>Today Paying</h1>
            <p>Ready to track your budget today?</p>
        </div>
        <div class="profile-btn">
            <i data-lucide="user"></i>
        </div>
    </div>

    <!-- ส่วนสรุปข้อมูล -->
    <div class="summary-row">
        <div class="summary-card">
            <i data-lucide="arrow-down-circle"></i>
            <h3>รายรับ</h3>
            <p id="total-income">฿0</p>
        </div>
        <div class="summary-card">
            <i data-lucide="arrow-up-circle"></i>
            <h3>รายจ่าย</h3>
            <p id="total-expense">฿0</p>
        </div>
        <div class="summary-card">
            <i data-lucide="wallet"></i>
            <h3>คงเหลือ</h3>
            <p id="total-balance">฿0</p>
        </div>
    </div>

    <!-- ส่วน Progress -->
    <div class="progress-card">
        <div class="progress-card-header">
            <h2>งบประมาณของคุณ</h2>
            <i data-lucide="target"></i>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="budget-progress"></div>
        </div>
        <div class="progress-text" id="progress-text">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- ส่วนรายการใช้จ่ายล่าสุด -->
    <div class="section-title">
        <h3>รายการ (Transactions)</h3>
        <button class="add-btn">
            <i data-lucide="plus" size="20"></i>
        </button>
    </div>

    <div class="transaction-list" id="transaction-container">
        <div class="loading-text">กำลังดึงข้อมูลจาก Sheet...</div>
    </div>

    <!-- เมนูด้านล่าง -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <i data-lucide="home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i data-lucide="pie-chart"></i>
            <span>Stats</span>
        </div>
        <div class="nav-item">
            <i data-lucide="settings"></i>
            <span>Settings</span>
        </div>
    </div>
</div>

<script>
    // สร้างไอคอนเริ่มต้น
    lucide.createIcons();

    // ==============================================================
    // 🔴 1. ตั้งค่า API และชื่อคอลัมน์ (กรุณาแก้ให้ตรงกับ Sheet ของคุณ)
    // ==============================================================
    const apiUrl = 'https://script.google.com/macros/s/AKfycbzbKOKDn6c3vvg_dvNLtOH07Mh6bluJ0if5jzIEZIJzuyRmE1kbvXkosNQy8IDdNYeCfA/exec';
    
    // พิมพ์ชื่อหัวตารางให้เป๊ะๆ (คำนึงถึงเว้นวรรคด้วย)
    const COL_NAME = 'รายการ';       // คอลัมน์ที่เก็บชื่อรายการ
    const COL_CATEGORY = 'หมวดหมู่';  // คอลัมน์ที่เก็บหมวดหมู่
    const COL_AMOUNT = 'จำนวนเงิน';   // คอลัมน์ที่เก็บตัวเลข
    const COL_TYPE = 'ประเภท';      // คอลัมน์ที่บอกว่าเป็น 'รายรับ' หรือ 'รายจ่าย'
    // ==============================================================

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            let totalIncome = 0;
            let totalExpense = 0;
            const container = document.getElementById('transaction-container');
            container.innerHTML = ''; // ล้างข้อความ Loading

            // ถ้าไม่มีข้อมูลเลย
            if(data.length === 0) {
                container.innerHTML = '<div class="loading-text">ยังไม่มีข้อมูลในระบบ</div>';
                return;
            }

            // วนลูปสร้างรายการจาก Sheet (แสดงจากล่างขึ้นบน จะได้เห็นของใหม่ล่าสุดก่อน)
            data.reverse().forEach(row => {
                
                // ข้ามถ้าบรรทัดนั้นไม่มีชื่อรายการหรือจำนวนเงิน
                if (!row[COL_NAME] || !row[COL_AMOUNT]) return;

                const amount = parseFloat(row[COL_AMOUNT].toString().replace(/,/g, '')) || 0;
                
                // เช็คเงื่อนไขรายรับ (รองรับคำว่า 'รายรับ' หรือ 'Income')
                const typeStr = row[COL_TYPE] ? row[COL_TYPE].trim() : '';
                const isIncome = typeStr === 'รายรับ' || typeStr === 'Income'; 

                if (isIncome) {
                    totalIncome += amount;
                } else {
                    totalExpense += amount;
                }

                // กำหนดไอคอนตามประเภทและหมวดหมู่
                let iconName = 'shopping-bag';
                let iconClass = 'icon-expense';
                let amountClass = 'item-amount';
                let sign = '-';
                
                const category = row[COL_CATEGORY] ? row[COL_CATEGORY].toLowerCase() : '';

                if (isIncome) {
                    iconName = 'wallet';
                    iconClass = 'icon-income';
                    amountClass = 'item-amount income';
                    sign = '+';
                } else if (category.includes('อาหาร') || category.includes('กิน') || category.includes('food')) {
                    iconName = 'utensils';
                } else if (category.includes('เดินทาง') || category.includes('รถ') || category.includes('transport')) {
                    iconName = 'car';
                } else if (category.includes('บ้าน') || category.includes('ของใช้')) {
                    iconName = 'home';
                }

                // สร้าง HTML
                const itemHTML = `
                <div class="transaction-item">
                    <div class="item-left">
                        <div class="item-icon ${iconClass}">
                            <i data-lucide="${iconName}"></i>
                        </div>
                        <div class="item-details">
                            <h4>${row[COL_NAME]}</h4>
                            <p>${row[COL_CATEGORY] || '-'}</p>
                        </div>
                    </div>
                    <div class="${amountClass}">${sign} ฿${amount.toLocaleString()}</div>
                </div>`;
                
                container.innerHTML += itemHTML;
            });

            // อัปเดตตัวเลขรวม
            const balance = totalIncome - totalExpense;
            document.getElementById('total-income').innerText = `฿${totalIncome.toLocaleString()}`;
            document.getElementById('total-expense').innerText = `฿${totalExpense.toLocaleString()}`;
            document.getElementById('total-balance').innerText = `฿${balance.toLocaleString()}`;

            // อัปเดต Progress Bar (เทียบบัญชีรายจ่ายกับรายรับ)
            const budgetTarget = totalIncome > 0 ? totalIncome : 1; // กันหารด้วย 0
            let percent = (totalExpense / budgetTarget) * 100;
            const displayPercent = percent > 100 ? 100 : percent;
            
            document.getElementById('budget-progress').style.width = `${displayPercent}%`;
            
            if(totalIncome > 0) {
                document.getElementById('progress-text').innerText = `ใช้จ่ายไปแล้ว ${percent.toFixed(0)}% ของรายรับทั้งหมด`;
            } else {
                document.getElementById('progress-text').innerText = `ยังไม่มีรายรับเข้ามา`;
            }
            
            // วาดไอคอนใหม่สำหรับรายการที่เพิ่งสร้าง
            lucide.createIcons();
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById('transaction-container').innerHTML = '<div class="loading-text" style="color:red;">พบปัญหาการเชื่อมต่อข้อมูล กรุณาตรวจสอบ API หรือชื่อคอลัมน์</div>';
        });
</script>

</body>
</html>
